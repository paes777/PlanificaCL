# Custom deployment workflow bypassing the buggy actions wrapper
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify Secret Presence
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANIFICACL }}" ]; then
            echo "::error::La clave secreta FIREBASE_SERVICE_ACCOUNT_PLANIFICACL esta vacia en GitHub."
            exit 1
          fi
          
      - name: Create Credentials File
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANIFICACL }}
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > service-account.json
          
      - name: Verify JSON Validity
        run: python verify_json.py
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          firebase deploy --only hosting --project planificacl-a49c4 --non-interactive --debug > deploy.log 2>&1 || {
            echo "::error::Deployment failed. Outputting debug logs:"
            python -c "
            import sys
            try:
                for line in open('deploy.log', encoding='utf-8'):
                    print(f'::warning::{line.strip()}')
            except Exception as e:
                print(f'::error::Failed to read deploy.log: {e}')
            "
            exit 1
          }

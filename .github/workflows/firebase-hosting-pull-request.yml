# Custom deployment workflow bypassing the buggy actions wrapper
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify Secret Presence
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANIFICACL }}" ]; then
            echo "::error::La clave secreta FIREBASE_SERVICE_ACCOUNT_PLANIFICACL esta vacia en GitHub."
            exit 1
          fi
          
      - name: Create Credentials File
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANIFICACL }}' > service-account.json
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
        run: firebase deploy --only hosting --non-interactive
